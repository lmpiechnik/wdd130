<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - AVENTURA TOTAL - Rafting</title>
    <link rel="stylesheet" href="estilos/contato.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-placeholder">
                <img src="imagens/logomarca.png" alt="Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="viagens.html">Viagens</a></li>
                    <li><a href="contato.html">Fale Conosco</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="address-info">
            <h1>AVENTURA TOTAL - Rafting</h1>
            <p>Rua Padres Redentoristas, 135</p>
            <p>Tibagi, Paraná</p>
            <p>+55 42 98877-6655</p>
            <p>info@aventuratotal.com</p>
        </section>

        <section class="contact-section">
            <div class="map-container">
                <img src="imagens/mapa.png" alt="Mapa">
            </div>
            
            <form class="contact-form">
                <div class="form-row">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite aqui">
                </div>
                
                <div class="form-row">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite aqui">
                </div>

                <div class="form-row purpose-row">
                    <label>Propósito da Mensagem</label>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" checked> Dúvida Geral</label>
                        <label><input type="radio" name="purpose"> Pergunta sobre Reserva</label>
                        <label><input type="radio" name="purpose"> Sugestão</label>
                    </div>
                </div>

                <div class="form-row message-row">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" placeholder="Digite aqui"></textarea>
                </div>

                <div class="form-row newsletter-row">
                    <label><input type="checkbox"> Por favor, me inscreva na newsletter mensal</label>
                </div>

                <button type="submit">Entrar em Contato!</button>
            </form>
        </section>

        <section class="team-outer-box">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="team-container">
                <div class="team-card">
                    <div class="img-placeholder">
                        <img src="imagens/perfil1.png" alt="Perfil">
                    </div>
                    <p>Nossos Instrutores</p>
                </div>
                <div class="team-card">
                    <div class="img-placeholder">
                        <img src="imagens/perfil2.png" alt="Perfil">
                    </div>
                    <p>Equipe de Apoio</p>
                </div>
                <div class="team-card">
                    <div class="img-placeholder">
                        <img src="imagens/perfil3.png" alt="Perfil">
                    </div>
                    <p>Equipe de Escritório</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>Links de Mídia Social</p>
            <div class="social-box">
                <a href="https://facebook.com" target="_blank">
                    <img src="imagens/facebook-logo.png" alt="Ícone do Facebook">
                </a>
                <a href="https://linkedin.com" target="_blank">
                    <img src="imagens/linkedin-logo.png" alt="Ícone do LinkedIn">  
                </a>      
                <a href="https://instagram.com" target="_blank">
                    <img src="imagens/instagram-logo.png" alt="Ícone do Instagram">
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
